[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnutils"
version = "0.1.0"
description = "Personal pwn exercise scaffolding tool"
requires-python = ">=3.9"
dependencies = [
    "pwntools",
]

[project.scripts]
pwnutils = "pwnutils.cli:main"

[tool.setuptools]
packages = ["pwnutils"]
